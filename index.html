<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Untitled</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js">
    </script>
  </head>
  
  <body>
   <script>
    let fullmoonX = 650;
     let fullmoonY = 150;
     let fullmoonSize = 100;
     let canvasWidth = 900;
     let canvasHeight = 700;

function setup(){
       createCanvas(canvasWidth,canvasHeight)
     }
     
     function draw(){
       background('black');
       
       moon();
       rocket();
       flames();
       pointer();
     }
     function moon(){
       fill('white');
     ellipse(650,150,100,100);
     }
       function rocket(){
       fill('teal');
       rotate(QUARTER_PI);
     rect(425,250,50,100);
       }
       
       function flames(){
       fill('orange');
       stroke('orange')
       line(450,350,450,460);
         line(450,350,470,490);
         line(450,350,430,440);
       }
     
       function pointer(){
       fill('red')
       triangle(450,200,400,250,500,250)
     }
    
    </script>
  </body>
</html>
