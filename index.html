  <body>
   <script>
    let fullmoonX = 300;
     let fullmoonY = 300;
     let fullmoonSize = 80;
     
     function setup(){
       createCanvas(900,700)
       background('black');
     }
     
     function draw(){
       //moon
       fill('white');
     ellipse(650,100,80,80);
     
       function draw(){
       //rocket
       fill('grey');
       rotate(QUARTER_PI);
     rect(200,250,50,100);
       }
       
       function draw(){
       //flames
       fill('orange');
       stroke('orange')
       line(0,450,800,450);
       }
     
       function draw(){

       fill('red')
       triangle(300,450,200,300,400,300)
       }
     }
